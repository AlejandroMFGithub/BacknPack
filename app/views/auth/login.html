{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Entrar</h1>
  <form method="post">
    <label>Usuario <input name="username" required autofocus></label>
    <label>Contraseña <input name="password" type="password" required></label>
    <button>Entrar</button>
  </form>
  {% if registration != 'closed' %}
  <p class="small">¿Jugador nuevo? <a href="{{ url_for('auth.register') }}">Crea una cuenta</a>.</p>
  {% endif %}
</div>
{% endblock %}
